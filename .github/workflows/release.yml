name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: paper-codex-switch-windows-x64.exe, bin: paper-codex-switch.exe }
          - { os: macos-13, target: x86_64-apple-darwin, asset: paper-codex-switch-macos-x64, bin: paper-codex-switch }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: paper-codex-switch-macos-arm64, bin: paper-codex-switch }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: paper-codex-switch-linux-x64, bin: paper-codex-switch }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
